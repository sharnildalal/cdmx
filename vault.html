      {c:'cafes',n:'Vegamo',h:'Centro / Roma edge',a:'Revillagigedo 47',s:[],d:'All-vegan deli, bakery, and cafe with Mexican and international plates, matcha drinks, smoothies, and sweet bread.',v:1,f:[['💰','Budget-friendly. Menu del dia around MXN 55.'],['⏰','Daily 10 AM to 10 PM.'],['🌮','Try the waffle sandwich, enfrijoladas, or posole. Great bakery selection.'],['🏆','4.5 TripAdvisor (92 reviews), 4.6 Uber Eats (1,000+ ratings).']]},
    ];

    const neighborhoodAliases = {
      'Juárez / Zona Rosa': ['Juárez', 'Zona Rosa'],
      'Reforma / Cuauhtémoc': ['Reforma', 'Cuauhtémoc'],
      'Condesa edge': ['Condesa'],
      'Hipódromo / Condesa': ['Hipódromo', 'Condesa'],
      'Juárez / Roma edge': ['Juárez'],
      'Roma Sur / Roma Norte': ['Roma Sur', 'Roma Norte']
    };

    function neighborhoodsFor(venue) {
      return neighborhoodAliases[venue.h] || [venue.h];
    }

    const neighborhoods = [...new Set(venues.flatMap(neighborhoodsFor))]
      .sort((a, b) => a.localeCompare(b, 'es'));

    const statusLabels = {
      planned: ['✓ On Itinerary', 'status-planned'],
      must: ['★ Must Do', 'status-must'],
      watch: ['⚠ Verify First', 'status-watch']
    };

    function esc(value) {
      return String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    }

    function mapsUrl(v) {
      const query = [v.n, v.a, 'Ciudad de México', 'Mexico'].filter(Boolean).join(', ');
      return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
    }

    function cardHtml(v, cat) {
      const href = mapsUrl(v);
      const tags = [
        `<span class="tag ${cat.tagClass}">${esc(cat.tag)}</span>`,
        `<span class="tag tag-hood">${esc(v.h)}</span>`,
        ...v.s.map(s => `<span class="status ${statusLabels[s][1]}">${statusLabels[s][0]}</span>`)
      ].join('');
      const facts = [["📍", v.a], ...v.f].map(([icon,text]) => `<li class="fact"><span class="fact-icon" aria-hidden="true">${icon}</span><span>${esc(text)}</span></li>`).join('');
      return `<article class="venue-card reveal" data-category="${v.c}" data-neighborhoods="${esc(neighborhoodsFor(v).join('|'))}" data-veggie="${v.v?1:0}" data-search="${esc((v.n+' '+v.h+' '+v.d+' '+v.f.flat().join(' ')).toLowerCase())}">
        <div class="card-top"><h3 class="venue-name"><a class="venue-link" href="${href}" target="_blank" rel="noopener">${esc(v.n)}</a></h3><a class="map-arrow" href="${href}" target="_blank" rel="noopener" aria-label="Open ${esc(v.n)} in Google Maps">↗</a></div>
        <div class="tags">${tags}</div>
        <p class="venue-desc">${esc(v.d)}</p>
        <ul class="fact-list">${facts}</ul>
        ${v.r ? `<div class="reservation">📅 ${esc(v.r)}</div>` : ''}
      </article>`;
    }

    const vault = document.getElementById('vault');
    vault.innerHTML = categories.map(cat => {
      const items = venues.filter(v => v.c === cat.id);
      const extras = cat.id === 'tacos' ? `<div class="saved-notes reveal">
        <h3>Saved food notes</h3>
        <p>Original comparison tables kept here for quick reference. One Centro lead remains unidentified, so it is not listed as a venue.</p>
        <div class="note-images">
          <figure><img src="img/v-img02.jpg" alt="Saved table comparing El Vilsito, Los Callejeros, Taquería El Califa, and an unidentified Centro taco lead" loading="lazy"><figcaption>Classic and Centro taco shortlist</figcaption></figure>
          <figure><img src="img/v-img03.jpg" alt="Saved table comparing five vegan taco shops by style, specialty, tortilla, and price" loading="lazy"><figcaption>Vegan taco shortlist</figcaption></figure>
        </div>
        <div class="lead-note"><strong>Open lead:</strong> A fresh-tortilla taco spot in Centro, under MXN 100 and good for a quick daytime bite. The screenshot did not identify the venue, so the Vault does not guess.</div>
      </div>` : '';
      return `<section class="category" id="${cat.id}" data-category-section="${cat.id}">
        <div class="section-head">
          <div class="section-emoji" aria-hidden="true">${cat.emoji}</div>
          <div><div class="section-title-row"><h2>${cat.title}</h2><span class="section-count">${items.length} ${items.length === 1 ? 'spot' : 'spots'}</span></div><p>${cat.blurb}</p></div>
        </div>
        <div class="venue-grid">${items.map(v => cardHtml(v, cat)).join('')}</div>${extras}
      </section>`;
    }).join('');

    const filters = document.getElementById('filters');
    filters.innerHTML = `<button class="filter-pill" type="button" data-filter="all" aria-pressed="true">All ${venues.length}</button>` + categories.map(cat => {
      const count = venues.filter(v => v.c === cat.id).length;
      return `<button class="filter-pill" type="button" data-filter="${cat.id}" aria-pressed="false">${cat.emoji} ${cat.label} ${count}</button>`;
    }).join('') + `<button class="filter-pill" type="button" data-filter="veggie" aria-pressed="false">🌱 Veggie ${venues.filter(v=>v.v).length}</button>`;

    const neighborhoodSelect = document.getElementById('neighborhood-select');
    neighborhoodSelect.insertAdjacentHTML('beforeend', neighborhoods.map(neighborhood =>
      `<option value="${esc(neighborhood)}">${esc(neighborhood)}</option>`
    ).join(''));

    const search = document.getElementById('venue-search');
    const clear = document.querySelector('.clear-search');
    const resultCount = document.getElementById('result-count');
    const activeLabel = document.getElementById('active-label');
    const empty = document.getElementById('empty-state');
    let activeCategory = 'all';
    let activeNeighborhood = 'all';

    function applyFilters(options = {}) {
      const query = search.value.trim().toLowerCase();
      let visible = 0;
      document.querySelectorAll('.category').forEach(section => {
        const catMatch = activeCategory === 'all' || activeCategory === 'veggie' || section.dataset.categorySection === activeCategory;
        let sectionVisible = 0;
        section.querySelectorAll('.venue-card').forEach(card => {
          const cardNeighborhoods = card.dataset.neighborhoods.split('|');
          const neighborhoodMatch = activeNeighborhood === 'all' || cardNeighborhoods.includes(activeNeighborhood);
          const veggieMatch = activeCategory !== 'veggie' || card.dataset.veggie === '1';
          const match = catMatch && veggieMatch && neighborhoodMatch && (!query || card.dataset.search.includes(query));
          card.classList.toggle('is-hidden', !match);
          if (match) { sectionVisible++; visible++; }
        });
        section.hidden = !catMatch || sectionVisible === 0;
      });
      resultCount.textContent = visible;
      resultCount.nextSibling.textContent = visible === 1 ? ' place ready' : ' places ready';
      const cat = activeCategory === 'veggie' ? {title:'Veggie / Vegan'} : categories.find(c => c.id === activeCategory);
      const labels = [];
      if (cat) labels.push(cat.title);
      if (activeNeighborhood !== 'all') labels.push(activeNeighborhood);
      if (query) labels.push(`“${search.value.trim()}”`);
      activeLabel.textContent = labels.length ? labels.join(' · ') : 'All categories and neighborhoods';
      clear.style.display = query ? 'block' : 'none';
      empty.style.display = visible ? 'none' : 'block';
      if (options.scroll && visible) {
        const target = activeCategory === 'all' ? document.querySelector('.result-line') : document.getElementById(activeCategory);
        target.scrollIntoView({behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'});
      }
    }

    filters.addEventListener('click', event => {
      const button = event.target.closest('[data-filter]');
      if (!button) return;
      activeCategory = button.dataset.filter;
      filters.querySelectorAll('.filter-pill').forEach(pill => pill.setAttribute('aria-pressed', String(pill === button)));
      applyFilters({scroll:true});
    });
    neighborhoodSelect.addEventListener('change', () => {
      activeNeighborhood = neighborhoodSelect.value;
      applyFilters({scroll:true});
    });
    search.addEventListener('input', () => applyFilters());
    clear.addEventListener('click', () => { search.value = ''; search.focus(); applyFilters(); });
    document.getElementById('reset-search').addEventListener('click', () => {
      activeCategory = 'all'; activeNeighborhood = 'all'; search.value = ''; neighborhoodSelect.value = 'all';
      filters.querySelectorAll('.filter-pill').forEach(pill => pill.setAttribute('aria-pressed', String(pill.dataset.filter === 'all')));
      applyFilters({scroll:true});
    });
    applyFilters();

    const revealObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, {threshold:.08, rootMargin:'0px 0px -5% 0px'});
    document.querySelectorAll('.reveal').forEach((el, index) => {
      el.style.transitionDelay = `${(index % 4) * 45}ms`;
      revealObserver.observe(el);
    });
  </script>
